services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demotrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demotrade}
      POSTGRES_DB: ${POSTGRES_DB:-demotrade}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demotrade}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demotrade}:${POSTGRES_PASSWORD:-demotrade}@postgres:5432/${POSTGRES_DB:-demotrade}
      ALEMBIC_DATABASE_URL: postgresql://${POSTGRES_USER:-demotrade}:${POSTGRES_PASSWORD:-demotrade}@postgres:5432/${POSTGRES_DB:-demotrade}
      REDIS_URL: redis://redis:6379/0
      # Must match ml_worker's broker/backend below — POST /api/v1/ml/train
      # sends a task via mlw.celery_app, which needs the SAME broker DB the
      # ml_worker container is consuming from.
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demotrade}:${POSTGRES_PASSWORD:-demotrade}@postgres:5432/${POSTGRES_DB:-demotrade}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app/services/worker:/app/services/api
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app:app worker -B --loglevel=INFO

  ml_worker:
    build:
      context: .
      dockerfile: infra/ml_worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demotrade}:${POSTGRES_PASSWORD:-demotrade}@postgres:5432/${POSTGRES_DB:-demotrade}
      # Dedicated DB indices — MUST differ from the `worker` service's
      # (1, 2) or both Celery apps will pull from the same broker
      # namespace and misroute each other's tasks.
      CELERY_BROKER_URL: redis://redis:6379/3
      CELERY_RESULT_BACKEND: redis://redis:6379/4
      ML_ARTIFACT_DIR: /var/lib/demo-trade/ml
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ml_artifacts:/var/lib/demo-trade/ml

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      # Same AUTH_SECRET both sides so JWTs verify cross-service
      AUTH_SECRET: ${AUTH_SECRET:-${API_SECRET_KEY:-}}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-demo-trade.session}
      AUTH_SESSION_MAX_AGE_S: ${AUTH_SESSION_MAX_AGE_S:-604800}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  ml_artifacts:
